[project]
name = "icoda"
version = "0.1.0"
description = "ICODA: Interactive Code Development and Analysis"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "clang>=20",
    "networkx>=3",
    "jsonschema>=4",
]

[project.optional-dependencies]
# The libclang wheel bundles a library for machines without a toolchain; it replaces the bindings above.
fallback = ["libclang>=18"]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "pillow>=10,<13",
    "ruff>=0.6,<1",
    "mypy>=1.11,<3",
]

[tool.setuptools]
packages = ["icoda_core", "icoda_gui"]

[tool.setuptools.package-data]
icoda_core = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.coverage.run]
branch = true
omit = ["tests/*", ".icoda-venv/*"]
